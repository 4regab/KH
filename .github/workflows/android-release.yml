name: Android release
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - run: bash ./gradlew clean --no-daemon
      - run: bash ./gradlew test --no-daemon
      - run: bash ./gradlew lint --no-daemon
      - run: bash ./gradlew assembleRelease --no-daemon
      - run: python3 scripts/verify-release.py app/build/outputs/apk/release/app-release-unsigned.apk --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-validation-build
          path: app/build/outputs/apk/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
  sign-and-publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-validation-build
          path: unsigned
      - name: Sign with the established key
        env:
          KEYSTORE_BASE64: ${{ secrets.KH_KEYSTORE_BASE64 }}
          KH_STORE_PASSWORD: ${{ secrets.KH_STORE_PASSWORD }}
          KH_KEY_ALIAS: ${{ secrets.KH_KEY_ALIAS }}
          KH_KEY_PASSWORD: ${{ secrets.KH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KH_STORE_PASSWORD KH_KEY_ALIAS KH_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Supply the established v3.2 key; never generate a replacement."
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kh.keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kh.keystore"
          mkdir -p dist
          VERSION=$(python3 -c 'import json; print(json.load(open("unsigned/app-release-unsigned.json"))["versionName"])')
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/kh.keystore" --ks-key-alias "$KH_KEY_ALIAS" \
            --ks-pass env:KH_STORE_PASSWORD --key-pass env:KH_KEY_PASSWORD \
            --out "dist/KH-v${VERSION}-release.apk" "$RUNNER_TEMP/aligned.apk"
          python3 scripts/verify-release.py "dist/KH-v${VERSION}-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            dist/*.apk
            dist/*.json
            dist/*.sha256
          if-no-files-found: error
      - name: Publish tagged release and verify download
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/master
          VERSION=${GITHUB_REF_NAME#v}
          cp docs/releases/"${VERSION}.md" "$RUNNER_TEMP/notes.md"
          python3 - <<'PY'
          import glob, json, os
          info = json.load(open(glob.glob('dist/*.json')[0]))
          with open(os.environ['RUNNER_TEMP'] + '/notes.md', 'a') as f:
              f.write('\nBuild metadata:\n```json\n' + json.dumps(info, indent=2) + '\n```\n')
          PY
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "KH ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*.apk dist/*.json dist/*.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false
          mkdir -p "$RUNNER_TEMP/download"
          gh release download "$GITHUB_REF_NAME" --pattern '*.apk' --dir "$RUNNER_TEMP/download"
          cmp "dist/KH-v${VERSION}-release.apk" "$RUNNER_TEMP/download/KH-v${VERSION}-release.apk"
          URL=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .url')
          curl --fail --location --retry 3 "$URL" --output "$RUNNER_TEMP/public-download.apk"
          cmp "dist/KH-v${VERSION}-release.apk" "$RUNNER_TEMP/public-download.apk"
